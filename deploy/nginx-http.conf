# Initial setup only: no account, payment or generated-site traffic is exposed.
server {
    listen 80;
    listen [::]:80;
    server_name draftmango.com www.draftmango.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        add_header Retry-After 3600 always;
        return 503 "Draftmango is being prepared. Please check back soon.\n";
    }
}
