# Exact apex/www vhosts take precedence over this wildcard.
server {
    listen 80;
    server_name *.draftmango.com;
    access_log off;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name *.draftmango.com;
    ssl_certificate /etc/letsencrypt/draftmango-publishing/live/draftmango-sites/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/draftmango-publishing/live/draftmango-sites/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 1k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $publishing_upstream draftmango-publisher:4177;
        proxy_pass http://$publishing_upstream;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 12s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
    }
}
